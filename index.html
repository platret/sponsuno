<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sponsuno – Sponsoring für Sport und Kultur</title>
  <meta name="description" content="Sponsuno bringt Sportlerinnen, Sportler sowie Sport- und Kulturvereine mit passenden Sponsoren aus ihrer Region zusammen. Start in der Deutschschweiz.">
  <meta name="theme-color" content="#0B1830">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    document.documentElement.classList.add('js');
    // Runs before first paint: .motion enables the CSS start states of reveals and the hero intro.
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
    // Failsafe: if the app never starts, show everything that waits for a reveal (cleared in App.tsx)
    window.__revealFailsafe = setTimeout(function () { document.documentElement.classList.add('reveal-all'); }, 4000);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

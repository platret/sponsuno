<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Title, description, canonical, share tags and JSON-LD come from src/pages.ts at build time (scripts/prerender.mjs) -->
  <title>Sponsuno – Sponsoren finden für Sport und Kultur</title>
  <!--seo-->
  <meta name="theme-color" content="#0B1830">
  <meta name="color-scheme" content="light dark">
  <meta name="darkreader-lock">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    document.documentElement.classList.add('js');
    // Runs before first paint: .motion enables the CSS start states of reveals and the hero intro.
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('motion');
      // .scroll-fx enables the scroll-driven primitives (data-scroll, site.css) where the browser supports them
      if (window.CSS && CSS.supports('animation-timeline', 'view()')) document.documentElement.classList.add('scroll-fx');
    }
    // Failsafe: if the app never starts, show everything that waits for a reveal (cleared in App.tsx)
    window.__revealFailsafe = setTimeout(function () { document.documentElement.classList.add('reveal-all'); }, 4000);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sponsuno Vorschau</title>
  <meta name="description" content="Produktvorschau von Sponsuno mit Beispieldaten.">
  <!-- Prototype with example data: keep it out of search results -->
  <meta name="robots" content="noindex">
  <!-- Share preview (link in a chat, e-mail or post). Written by hand: the demo is not in src/pages.ts, so headFor() does
       not cover it and the prerender check does not apply. Same share image as the other pages (public/og-image.png);
       noindex stays, share crawlers read these tags anyway. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sponsuno">
  <meta property="og:locale" content="de_CH">
  <meta property="og:title" content="Sponsuno: Produktvorschau mit Beispieldaten">
  <meta property="og:description" content="Die Produktvorschau von Sponsuno mit Beispieldaten: die Sicht einer Sportlerin und die eines Sponsors aus der Region.">
  <meta property="og:url" content="https://sponsuno.ch/demo/">
  <meta property="og:image" content="https://sponsuno.ch/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Sponsuno: Sponsoren finden für Sport und Kultur. Bald verfügbar in der Deutschschweiz.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0B1830">
  <meta name="color-scheme" content="light dark">
  <meta name="darkreader-lock">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
  </script>
</head>
<body>
  <div id="root">
    <!-- Replaced by the app once it runs (src/demo/main.tsx) -->
    <noscript>
      <p class="demo-noscript">Die Produktvorschau braucht JavaScript. Bitte aktivieren Sie es, oder lesen Sie auf der <a href="../">Startseite</a>, wie Sponsuno funktioniert.</p>
    </noscript>
  </div>
  <script type="module" src="/src/demo/main.tsx"></script>
</body>
</html>

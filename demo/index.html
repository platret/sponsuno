<!doctype html>
<!-- data-theme="light": the demo keeps the light look in both themes (its stylesheets use the CD colours directly,
     DESIGN.md -> Theme), so no theme script here and the shared tokens stay light -->
<html lang="de-CH" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Build only: vite.config.ts puts a script here that preloads the first view's chunk (JS and CSS) -->
  <!--view-preload-->
  <title>Sponsuno Vorschau</title>
  <meta name="description" content="Produktvorschau von Sponsuno mit Beispieldaten.">
  <!-- Prototype with example data: keep it out of search results -->
  <meta name="robots" content="noindex">
  <!-- Share preview (link in a chat, e-mail or post). Written by hand: the demo is not in src/pages.ts, so headFor() does
       not cover it and the prerender check does not apply. Same share image as the other pages (public/og-image.png);
       noindex stays, share crawlers read these tags anyway. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sponsuno">
  <meta property="og:locale" content="de_CH">
  <meta property="og:title" content="Sponsuno: Produktvorschau mit Beispieldaten">
  <meta property="og:description" content="Die Produktvorschau von Sponsuno mit Beispieldaten: die Sicht einer Sportlerin und die eines Sponsors aus der Region.">
  <meta property="og:url" content="https://sponsuno.ch/demo/">
  <meta property="og:image" content="https://sponsuno.ch/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Sponsuno: Sponsoren finden für Sport und Kultur. Bald verfügbar in der Deutschschweiz.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0B1830">
  <meta name="color-scheme" content="light dark">
  <meta name="darkreader-lock">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- The three faces of the first screen, requested with the HTML instead of after the app has rendered (same hashed
       files as the @font-face rules in demo.css; scripts/prerender.mjs moves these behind the stylesheet and scripts).
       fetchpriority="low", unlike the prerendered pages: the demo paints nothing before its JavaScript has run, so the
       fonts must not take bandwidth from it (measured: LCP 1.81 s with low, 2.12 s with the default high priority). -->
  <link rel="preload" href="/src/assets/fonts/manrope-400.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low">
  <link rel="preload" href="/src/assets/fonts/manrope-600.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low">
  <link rel="preload" href="/src/assets/fonts/cormorant-garamond-600.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low">
  <script>
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
  </script>
</head>
<body>
  <div id="root">
    <!-- Replaced by the app once it runs (src/demo/main.tsx) -->
    <noscript>
      <p class="demo-noscript">Die Produktvorschau braucht JavaScript. Bitte aktivieren Sie es, oder lesen Sie auf der <a href="../">Startseite</a>, wie Sponsuno funktioniert.</p>
    </noscript>
  </div>
  <script type="module" src="/src/demo/main.tsx"></script>
</body>
</html>

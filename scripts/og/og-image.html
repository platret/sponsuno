<!--
  Source of public/og-image.png (share image, 1200 × 630). Not part of the build.
  Regenerate after a change (see AGENTS.md → SEO):
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --window-size=1200,630 --screenshot=public/og-image.png scripts/og/og-image.html
  (or any Chromium at 1200 × 630, device scale factor 1; wait for document.fonts.ready).
  Look: design system v2 «Turnhalle» after the clean-up pass (DESIGN.md, clean rules). Parquet ground, the hero line
  in Archivo Wide 800 (ink, the last word blue), the ink loop wordmark, the launch signal as the kit's flat yellow tag
  (never tilted), the hero's two thin court lines (a red base line, a blue corner arc) and ONE picture sticker, the
  ball, on the arc. Fonts: the site's own subsets (src/assets/fonts). Tag, sticker and line styles come straight from
  src/styles/kit.css (it carries every colour as a fallback, so it works without tokens.css); the sticker drawing is

<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Theme before the first paint: THEME_SCRIPT (src/lib/theme.ts), put here by vite.config.ts -->
  <!--theme-->
  <!-- Title, description, canonical and share tags come from src/pages.ts at build time (scripts/prerender.mjs) -->
  <title>Sponsuno</title>
  <!--seo-->
  <meta name="theme-color" content="#0B1830">
  <meta name="color-scheme" content="light dark">
  <meta name="darkreader-lock">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- The three faces of the first screen, requested with the HTML instead of after the CSS (same hashed files as the @font-face rules; scripts/prerender.mjs moves these behind the stylesheets) -->
  <link rel="preload" href="/src/assets/fonts/manrope-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/src/assets/fonts/manrope-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/src/assets/fonts/cormorant-garamond-600.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
  <!-- Prerendered at build time (scripts/prerender.mjs); works without JavaScript -->
  <div id="root" data-page="fragen"></div>
  <script type="module" src="/src/static/main.ts"></script>
  <script type="module" src="/src/static/sections.ts"></script>
</body>
</html>

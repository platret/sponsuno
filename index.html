<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sponsuno – Sponsoring für Sport und Kultur</title>
  <meta name="description" content="Sponsuno bringt Sportlerinnen, Sportler sowie Sport- und Kulturvereine mit passenden Sponsoren aus ihrer Region zusammen. Start in der Deutschschweiz.">
  <meta name="theme-color" content="#0B1830">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <script>
    // Runs before first paint: .js and .motion drive the CSS start states of the intro.
    // The failsafe reveals everything if the app never starts its intro.
    document.documentElement.classList.add('js');
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
    window.__introFailsafe = setTimeout(function () { document.documentElement.classList.add('intro-done'); }, 3500);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

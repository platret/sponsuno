<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">

<!--[if mso]>
<noscript><xml><o:OfficeDocumentSettings><o:AllowPNG/><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
<style>
  .serif { font-family: Georgia, 'Times New Roman', serif !important; }
  .sans, .sans a, .sans span, .sans strong { font-family: Arial, Helvetica, sans-serif !important; }
  /* Word engine: no padding on <a>, so the link cards get it on their cells (inline.css → .lcard-a, .lc-arrow-a) */
  .lcard-in { padding: 18px 12px 18px 22px !important; }
  .lc-arrow { padding: 0 22px 0 8px !important; }
</style>
<![endif]-->
<!-- Four separate style blocks on purpose: Gmail drops a whole block when it meets a rule it does not accept, so
     the phone layout (which Gmail does apply) never shares a block with the fonts, the resets or dark mode. -->
<style>
  /* Web fonts: only clients that load them (Apple Mail, iOS Mail). The serif face is declared as weight 400 but
     uses Cormorant 600, so headlines can stay font-weight normal and fall back to Georgia Regular, not Bold. */
  @media screen {
    @font-face { font-family: 'Sponsuno Serif'; font-style: normal; font-weight: 400; src: url('%%ASSET_BASE%%fonts/cormorant-garamond-600.woff2') format('woff2'); }
    @font-face { font-family: 'Sponsuno Sans'; font-style: normal; font-weight: 400; src: url('%%ASSET_BASE%%fonts/manrope-400.woff2') format('woff2'); }
    @font-face { font-family: 'Sponsuno Sans'; font-style: normal; font-weight: 600; src: url('%%ASSET_BASE%%fonts/manrope-600.woff2') format('woff2'); }
  }
</style>
<style>
  :root { color-scheme: light dark; supported-color-schemes: light dark; }
  html, body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
  body { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table { border-collapse: separate; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
  a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }
  u + #body a { color: inherit; text-decoration: none; }
  #MessageViewBody a { color: inherit; text-decoration: none; }
  .link:hover { text-decoration: none !important; }
  .btn:hover { background-color: #D3B47E !important; }
  .lcard-a:hover .lc-t { text-decoration: underline !important; }
</style>
<style>
  /* Phones */
  @media only screen and (max-width: 480px) {
    .wrap { padding: 12px 8px 28px !important; }
    /* Flat navy on phones: at this width the 135° gradient lightens behind the logo, where the PNG's navy plate
       (scripts/emails.mjs → WORDMARK.plate) would show its edge. Padding: see .header in inline.css. */
    .header { padding: 16px 24px 16px 14px !important; background-image: none !important; }
    .card { padding: 34px 24px 30px !important; }
    .footer { padding: 24px 24px 0 !important; }
    .h1 { font-size: 32px !important; line-height: 36px !important; }
    .btn-table { width: 100% !important; }
    .btn { display: block !important; padding-left: 16px !important; padding-right: 16px !important; }
    .lcard-a { padding: 16px 16px 16px 18px !important; }
    .lc-arrow-a { padding-right: 16px !important; }
  }
</style>
<style>
  /* Dark mode (Apple Mail, iOS Mail, Outlook for Mac). Gmail and Outlook ignore this and adjust colours themselves. */
  @media (prefers-color-scheme: dark) {
    .body-bg { background-color: #0B1830 !important; }
    .header { border: 1px solid #33476F !important; border-bottom: 0 !important; }
    .card { background-color: #15284A !important; border-color: #33476F !important; }
    .h1, .h2, .strong, .lc-t { color: #F3EFE6 !important; }
    .p, .lc-d { color: #C9CED8 !important; }
    .small, .footer, .footer-text { color: #B9BFCB !important; }
    .link, .footer-link, .lc-k, .lc-arrow-a { color: #C4A36B !important; }
    .rule { border-color: #33476F !important; }
    .lcard { background-color: #10203D !important; border-color: #33476F !important; }
  }
</style>
</head>
